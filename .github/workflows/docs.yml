name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # mike pushes the built site to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # mike needs full history of gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Configure git for mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy released version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest

      - name: Deploy development version
        if: github.ref == 'refs/heads/main'
        run: |
          mike deploy --push dev
          # Root (/docs/) redirects here until the first tagged release.
          mike set-default --push dev
